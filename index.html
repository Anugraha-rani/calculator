<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; ">
        <input type="text" style="width: 400px; height: 50px;" placeholder="0" readonly id="result">
        <div style="display: grid;  grid-template-columns: repeat(4,1fr); width: 400px; height: 300px; border: none; border-radius: 5px; ">
            <button id="but" onclick="calcDisplay('7')" >7</button>
            <button id="but" onclick="calcDisplay('8')">8</button>
            <button id="but" onclick="calcDisplay('9')">9</button>
            <button id="but" onclick="calcDisplay('*')">&#215;</button>

           

        
        
            <button id="but" onclick="calcDisplay('4')">4</button>
            <button id="but" onclick="calcDisplay('5')">5</button>
            <button id="but" onclick="calcDisplay('6')">6</button>
            <button id="but" onclick="calcDisplay('-')">&#8722;</button>

            <button id="but" onclick="calcDisplay('1')">1</button>
            <button id="but" onclick="calcDisplay('2')">2</button>
            <button id="but" onclick="calcDisplay('3')">3</button>
            <button id="but" onclick="calcDisplay('+')">+</button>

            <button id="but" onclick="delCalcScreen()">Del</button>
            <button id="but"></button>
            <button id="but"></button>
            <button id="but"></button>

            <button id="but" onclick="clearCalcScreen()">AC</button>
            <button id="but"  onclick="calcDisplay('0')">0</button>
            <button style="background: transparent; border: solid 1px grey; "  onclick="calcDisplay('/')">&#247;</button>
            <button id="but" onclick="calcResult()">=</button>
</div>


    </div>
    
</body>
<script src="./main.js">

</script>
</html>
